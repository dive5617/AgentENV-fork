name: Envd Tests

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level for the tests"
        required: false
  pull_request:
    paths:
      - "tools-image/**"
      - "thirdparty/envd/**"
      - "scripts/tests/test_envd.sh"
      - "scripts/lib/common.sh"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/rust-ci-setup/**"
      - ".github/workflows/envd-tests.yml"
      - ".github/workflows/publish-tools-image.yml"
  push:
    paths:
      - "tools-image/**"
      - "thirdparty/envd/**"
      - "scripts/tests/test_envd.sh"
      - "scripts/lib/common.sh"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/rust-ci-setup/**"
      - ".github/workflows/envd-tests.yml"
      - ".github/workflows/publish-tools-image.yml"

env:
  RUST_LOG: ${{ github.event.inputs.log_level || 'info' }}

permissions:
  contents: read
  packages: read

jobs:
  envd-source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools-image/envd/go.mod
          cache-dependency-path: |
            tools-image/envd/go.sum
            tools-image/envd/shared/go.sum
      - name: Install envd test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bindfs
      - name: Check in-tree envd source
        run: |
          make -C tools-image test
          make -C tools-image/envd fmt-check
          make -C tools-image/envd vet
          make -C tools-image/envd test
          make -C tools-image/envd build BUILD_ARCH=amd64

  envd-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        with:
          ci_deps_target: ci-deps-protoc
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Envd tests
        run: make test-envd
